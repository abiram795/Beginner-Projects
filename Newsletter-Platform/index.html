<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailGrid - Campaign & Subscriber Platform</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="glass">
        <a href="#" class="logo">
            <i class="fa-solid fa-paper-plane"></i> MailGrid
        </a>
        <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- App Container Layout splits -->
    <div class="campaigns-container">
        
        <!-- ================= LEFT COLUMN: CAMPAIGN BUILDER ================= -->
        <div style="display:flex; flex-direction:column; gap:2rem;">
            
            <!-- Overall Stats Dashboard -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-chart-bar" style="color:var(--accent);"></i> Dashboard Analytics</h2>
                <div class="stats-grid">
                    <div class="glass stat-item">
                        <div class="stat-val" id="stat-subscribers">4</div>
                        <div class="stat-lbl">Subscribers</div>
                    </div>
                    <div class="glass stat-item">
                        <div class="stat-val" id="stat-dispatched">0</div>
                        <div class="stat-lbl">Campaigns Sent</div>
                    </div>
                    <div class="glass stat-item">
                        <div class="stat-val" style="color:var(--success);">99.8%</div>
                        <div class="stat-lbl">Deliverability</div>
                    </div>
                </div>
            </div>

            <!-- Campaign Templates Presets -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-palette" style="color:var(--accent);"></i> Preset Layout Templates</h2>
                <div class="templates-row" id="templates-preset-grid">
                    <div class="glass template-card-item active" data-preset="briefing">
                        <i class="fa-solid fa-book-open-reader"></i>
                        <h4 style="font-size:0.85rem; font-weight:600; margin-top:0.25rem;">Weekly Briefing</h4>
                    </div>
                    <div class="glass template-card-item" data-preset="promo">
                        <i class="fa-solid fa-percent"></i>
                        <h4 style="font-size:0.85rem; font-weight:600; margin-top:0.25rem;">Promo Discount</h4>
                    </div>
                    <div class="glass template-card-item" data-preset="product">
                        <i class="fa-solid fa-rocket"></i>
                        <h4 style="font-size:0.85rem; font-weight:600; margin-top:0.25rem;">Product Update</h4>
                    </div>
                </div>
            </div>

            <!-- Email Campaign Composer -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-envelope-open-text" style="color:var(--accent);"></i> Dispatch Campaign</h2>
                <form id="campaign-composer-form" onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap:1.15rem;">
                    
                    <div class="form-group">
                        <label>Email Subject Line</label>
                        <input type="text" class="input-field" id="campaign-subject" placeholder="e.g. Chronicle Weekly Digest - July 2026" required>
                    </div>

                    <div class="form-group">
                        <label>Body Message Content</label>
                        <textarea class="input-field" id="campaign-body" rows="8" placeholder="Write message body content..." required></textarea>
                    </div>

                    <button type="submit" class="btn-primary" id="btn-dispatch-campaign">Simulate Send Campaign</button>
                </form>
            </div>

        </div>

        <!-- ================= RIGHT COLUMN: SUBSCRIBER MANAGEMENT ================= -->
        <div style="display:flex; flex-direction:column; gap:2rem;">
            
            <!-- Register subscriber form card -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-user-plus" style="color:var(--accent);"></i> Add Subscriber</h2>
                <form id="subscriber-add-form" onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap:1rem;">
                    
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="input-field" id="sub-name" placeholder="John Doe" required>
                    </div>

                    <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:0.75rem;">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" class="input-field" id="sub-email" placeholder="john@domain.com" required>
                        </div>
                        <div class="form-group">
                            <label>Subscription Status</label>
                            <select class="input-field" id="sub-status" required>
                                <option value="active">Active</option>
                                <option value="pending">Pending</option>
                                <option value="unsubscribed">Unsubscribed</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Add Subscriber</button>
                </form>
            </div>

            <!-- Subscribers comparison table ledger -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-users" style="color:var(--accent);"></i> Subscriber database</h2>
                
                <!-- Table Filters -->
                <div class="filter-row">
                    <input type="text" class="search-field" id="sub-search" placeholder="Search name, email..." style="width:180px;">
                    <select class="search-field" id="filter-sub-status" style="width:110px;">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="unsubscribed">Unsubscribed</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Subscriber</th>
                                <th>Status</th>
                                <th>Date Joined</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subscriber-table-body">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- Dispatch Toast Simulation overlay -->
    <div class="toast-container" id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
