<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finwise - Budget Planner & Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="glass">
        <a href="#" class="logo">
            <i class="fa-solid fa-wallet"></i> Finwise
        </a>
        <button class="btn-icon" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- App Container -->
    <div class="budget-container">
        
        <!-- ================= LEFT COLUMN: CONFIGURATION & STATS ================= -->
        <div style="display:flex; flex-direction:column; gap:2rem;">
            
            <!-- Overall Stats Card -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-chart-pie" style="color:var(--accent);"></i> Balance Sheet</h2>
                
                <!-- Income modifier -->
                <div class="form-group" style="flex-direction:row; align-items:center; justify-content:space-between;">
                    <label style="font-weight:600;">Monthly Income ($)</label>
                    <input type="number" id="input-income" value="5000" style="width:120px; text-align:right;" class="input-field">
                </div>

                <div class="stats-grid">
                    <div class="glass stat-item">
                        <div class="stat-val" id="stat-allocated">$0</div>
                        <div class="stat-lbl">Budgets Allocated</div>
                    </div>
                    <div class="glass stat-item">
                        <div class="stat-val" id="stat-spent" style="color:var(--warning);">$0</div>
                        <div class="stat-lbl">Total Expenses</div>
                    </div>
                    <div class="glass stat-item" style="grid-column: 1/-1;">
                        <div class="stat-val" id="stat-balance" style="color:var(--success); font-size:1.65rem;">$0</div>
                        <div class="stat-lbl">Safe-to-Spend Remainder</div>
                    </div>
                </div>
            </div>

            <!-- Set Category Budget limit -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-sliders" style="color:var(--accent);"></i> Configure Limit</h2>
                <form id="form-set-budget" onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap:1rem;">
                    <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:0.75rem;">
                        <div class="form-group">
                            <label>Category</label>
                            <select class="input-field" id="budget-category">
                                <option value="Food">Food & Dining</option>
                                <option value="Housing">Housing & Rent</option>
                                <option value="Utilities">Utilities & Bills</option>
                                <option value="Fun">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Transport">Transport</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Limit ($)</label>
                            <input type="number" class="input-field" id="budget-limit-val" value="300" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Set Budget Limit</button>
                </form>
            </div>

            <!-- Log Actual Expense form -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-receipt" style="color:var(--accent);"></i> Record Expense</h2>
                <form id="form-add-expense" onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap:1rem;">
                    
                    <div class="form-group">
                        <label>Description / Title</label>
                        <input type="text" class="input-field" id="exp-title" placeholder="e.g. Weekly Grocery, Cinema tickets" required>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.75rem;">
                        <div class="form-group">
                            <label>Category</label>
                            <select class="input-field" id="exp-category">
                                <option value="Food">Food & Dining</option>
                                <option value="Housing">Housing & Rent</option>
                                <option value="Utilities">Utilities & Bills</option>
                                <option value="Fun">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Transport">Transport</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Amount Spent ($)</label>
                            <input type="number" step="0.01" class="input-field" id="exp-amount" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Transaction Date</label>
                        <input type="date" class="input-field" id="exp-date" required>
                    </div>

                    <button type="submit" class="btn-primary">Log Expense</button>
                </form>
            </div>

        </div>

        <!-- ================= RIGHT COLUMN: METERS & LOGS TABLE ================= -->
        <div style="display:flex; flex-direction:column; gap:2rem;">
            
            <!-- Category Limits Visual Progress Bars -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-chart-line" style="color:var(--accent);"></i> Category Limits Visual Feedback</h2>
                <div class="budget-meters-list" id="budget-meters-container">
                    <!-- Progress bar meters injected here by JS -->
                </div>
            </div>

            <!-- Comparative Ledger Table -->
            <div class="glass section-card">
                <h2><i class="fa-solid fa-table-list" style="color:var(--accent);"></i> Expense Audit Log</h2>
                
                <!-- Table Filters -->
                <div class="filter-row">
                    <input type="text" class="search-field" id="exp-search" placeholder="Search expense title..." style="width:200px;">
                    <select class="search-field" id="filter-exp-category" style="width:120px;">
                        <option value="all">All Categories</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Housing">Housing & Rent</option>
                        <option value="Utilities">Utilities & Bills</option>
                        <option value="Fun">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Transport">Transport</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Spent</th>
                                <th>Status</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="expense-table-body">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
